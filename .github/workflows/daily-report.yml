name: Daily Maize Market Report

on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet "openai>=1.0.0" "ddgs>=7.0.0" requests

      - name: Configure git identity
        run: |
          git config user.email "automation@maize-market.app"
          git config user.name "Maize Market Bot"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

      - name: Generate report via OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_report.py

      - name: Validate generated JSON
        run: python scripts/validate_report.py

      - name: Commit and push report
        run: |
          TODAY=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          FILE="public/reports/maize_warehouse_report_${TODAY}.json"
          git add "$FILE"
          if git diff --staged --quiet; then
            echo "Nothing new to commit — report for $TODAY already in repo."
            exit 0
          fi
          git commit -m "chore: daily maize market report ${TODAY} [automated]"
          git push
          echo "Pushed $FILE"

      - name: Summary
        if: always()
        run: |
          TODAY=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          FILE="public/reports/maize_warehouse_report_${TODAY}.json"
          if [ -f "$FILE" ]; then
            SIZE=$(wc -c < "$FILE")
            echo "SUCCESS: $FILE (${SIZE} bytes)"
          else
            echo "FAILED: report file was not generated"
            exit 1
          fi
