name: Daily Maize Market Report

on:
  schedule:
    - cron: '0 1 * * 1-5'   # 6:30 AM IST (01:00 UTC) Mon–Fri
  workflow_dispatch:          # Manual trigger from GitHub UI

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      contents: write         # Needed to git push the report file

    steps:
      # ── 1. Set TODAY once — exported to all subsequent steps ───────────────
      - name: Set date
        run: echo "TODAY=$(date +%Y-%m-%d)" >> $GITHUB_ENV

      # ── 2. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 3. Node.js for Claude Code CLI ─────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 4. Install Claude Code CLI ─────────────────────────────────────────
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # ── 5. Configure git so the push step works ────────────────────────────
      - name: Configure git
        run: |
          git config user.email "automation@maize-market.app"
          git config user.name "Maize Market Automation"
          git remote set-url origin \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

      # ── 6. Generate the report via the shell script ────────────────────────
      #    --bare            → CI-safe: uses ANTHROPIC_API_KEY only (no OAuth/keychain)
      #    --dangerously-skip-permissions → no interactive prompts in CI
      - name: Generate report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash scripts/run_report.sh

      # ── 7. Commit and push ─────────────────────────────────────────────────
      - name: Commit and push report
        run: |
          FILE="public/reports/maize_warehouse_report_${{ env.TODAY }}.json"
          git add "$FILE"
          if git diff --staged --quiet; then
            echo "Nothing to commit — report already present for ${{ env.TODAY }}"
          else
            git commit -m "chore: daily maize market report ${{ env.TODAY }} [automated]"
            git push
            echo "Pushed: $FILE"
          fi

      # ── 8. Final status ────────────────────────────────────────────────────
      - name: Summary
        if: always()
        run: |
          FILE="public/reports/maize_warehouse_report_${{ env.TODAY }}.json"
          if [ -f "$FILE" ]; then
            echo "SUCCESS: $FILE was generated and pushed."
          else
            echo "FAILED: $FILE was not generated."
            exit 1
          fi
